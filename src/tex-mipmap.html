<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mipmap</title>
  </head>

  <body>
  	<h1 align=center>Mipmap</h1>
    <canvas id="webgpu" width="1024" height="1024">
    Please use a browser that supports "canvas"
    </canvas>
	<table>
		<tr>
			<td>texture:</td>
			<td><tt>
					<select id="texture">
						<option value="checkerboard">checkerboard</option>
						<option value="separate_colors">separate colors</option>
					</select>
				</tt>
			</td>
		</tr>
		<tr>
			<td><tt>magFilter:</tt></td>
			<td><tt>
					<select id="mag-filter">
						<option id="mag-LINEAR">LINEAR</option>
						<option id="mag-NEAREST" selected>NEAREST</option>
					</select>
				</tt>
			</td>
		</tr>
		<tr>
			<td><tt>minFilter:</tt></td>
			<td><tt>
					<select id="min-filter">
						<option id="min-LINEAR">LINEAR</option>
						<option id="min-NEAREST" selected>NEAREST</option>
					</select>
				</tt>
			</td>
		</tr>
		<tr>
			<td><tt>mipmap:</tt></td>
			<td><tt>
					<input type="checkbox" id="mipmap-enabled" checked>
				</tt>
			</td>
		</tr>
		<tr>
			<td><tt>mipmapFilter:</tt></td>
			<td><tt>
					<select id="mipmap-filter">
						<option id="mipmap-LINEAR">LINEAR</option>
						<option id="mipmap-NEAREST" selected>NEAREST</option>
					</select>
				</tt>
			</td>
		</tr>
		<tr>
			<td>speed</td>
			<td>
				<input type="range" id="speed", min=0 max=200 value=100>
			</td>
		</tr>

	</table>

    <script type="module" src="tex-mipmap.js"></script>
  </body>
</html>
